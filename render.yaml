services:
  - type: web
    name: salesman-gps
    runtime: node
    plan: free
    buildCommand: rm -rf dist && mkdir -p dist && cp index.html dist/ && cp -r app dashboard dist/
    startCommand: bash -c 'bash scripts/poll_loop.sh >> /tmp/poll_loop.log 2>&1 & exec node server/index.mjs'
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DASH_PASSPHRASE
        sync: false
      - key: DATA_DIR
        value: /tmp/salesman-gps-data
      - key: BUILD_REPORTS
        value: "1"
      - key: POLL_INTERVAL_S
        sync: false
      - key: AUTO_ASSIGN
        sync: false
