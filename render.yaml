services:
  - type: web
    name: salesman-gps
    runtime: node
    plan: free
    # dist/ carries the static pages; live.enc.json + roster are served from disk by
    # /api/live and ROSTER_FILE (the poller writes them into DATA_DIR), so a redeploy
    # no longer freezes the map.
    buildCommand: rm -rf dist && mkdir -p dist && cp index.html dist/ && cp -r app dashboard dist/
    startCommand: node server/index.mjs
    healthCheckPath: /healthz
    autoDeploy: false
    disks:
      # Persistent state shared with the poller worker. MUST use the same name and
      # mountPath in both services — that is how the web service reads live.enc.json
      # written by the poller, and how offset/roster survive redeploys.
      - name: salesman-gps-data
        mountPath: /var/tmp/salesman-gps-data
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DASH_PASSPHRASE
        sync: false
      # where the poller keeps its state; shared Disk (see disks:)
      - key: DATA_DIR
        value: /var/tmp/salesman-gps-data
      - key: ROSTER_FILE
        value: /var/tmp/salesman-gps-data/private/roster.enc.json

  # The Telegram poller. Replaces .github/workflows/poll.yml, which was deleted when
  # the system moved off GitHub Actions. Runs forever: one pass every POLL_INTERVAL_S
  # seconds, hourly report builds. Needs the same token + passphrase as the web service.
  - type: worker
    name: salesman-gps-poller
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev || true   # poller itself is dependency-free
    startCommand: bash scripts/poll_loop.sh
    autoDeploy: false
    disks:
      # Same Disk as the web service (identical name + mountPath) — this pair of
      # services communicates entirely through this shared volume.
      - name: salesman-gps-data
        mountPath: /var/tmp/salesman-gps-data
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DASH_PASSPHRASE
        sync: false
      - key: DATA_DIR
        value: /var/tmp/salesman-gps-data
      - key: AUTO_ASSIGN
        sync: false        # "0" = manual approval queue, unset/"1" = auto-register
      - key: POLL_INTERVAL_S
        sync: false        # seconds between getUpdates long-polls (default 15)
