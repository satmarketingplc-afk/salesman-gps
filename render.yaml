# ONE web service runs BOTH processes (server + Telegram poller loop) on a single
# filesystem. This is deliberate: Render free plans do not support Disks, and even on
# paid plans separate services cannot share one volume — so a two-service split would
# leave the web service unable to read the poller's live.enc.json (exactly the 503
# "no_data_dir" we hit). One process tree, one disk, /api/live just works.
#
# Trade-off (free tier): the service sleeps ~15 min after inactivity and restarts
# nightly; poll_loop resumes automatically on boot, so gaps in coverage are brief.
# When you outgrow it, upgrade the plan or move to a VPS — no code changes needed.
services:
  - type: web
    name: salesman-gps
    runtime: node
    plan: free
    buildCommand: rm -rf dist && mkdir -p dist && cp index.html dist/ && cp -r app dashboard dist/
    # & starts the poller loop in the background; exec keeps the server as PID 1 so
    # Render's signals still shut the web process down cleanly.
    startCommand: bash -c 'bash scripts/poll_loop.sh >> /tmp/poll_loop.log 2>&1 & exec node server/index.mjs'
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DASH_PASSPHRASE
        sync: false
      # Poller writes archive/, private/, dashboard/public under here; the server
      # reads live.enc.json + roster from the same dir via DATA_DIR defaults.
      - key: DATA_DIR
        value: /tmp/salesman-gps-data
      - key: BUILD_REPORTS
        value: "1"           # rebuild HTML reports hourly inside the loop
      - key: POLL_INTERVAL_S
        sync: false          # seconds between getUpdates passes (default 15)
      - key: AUTO_ASSIGN
        sync: false          # "0" = manual approval queue, unset/"1" = auto-register
