services:
  - type: web
    name: salesman-gps
    runtime: static
    buildCommand: rm -rf _site && mkdir -p _site && cp index.html _site/ && cp -r app dashboard _site/
    staticPublishPath: ./_site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: no-referrer
    routes:
      - type: redirect
        source: /
        destination: /index.html
