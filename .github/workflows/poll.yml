name: poll-telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-poll
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name  "smgps-bot"
          git config user.email "smgps-bot@users.noreply.github.com"

      - name: Poll loop (4.5 min, every 15 s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
        run: |
          set -u
          for i in $(seq 1 18); do
            commit_pass=""
            if [ $((i % 8)) -eq 0 ] || [ "$i" -eq 18 ]; then commit_pass=1; fi

            # Free-tier economy: the live payload (small) commits every pass, while the
            # archive + offset + report land at most once an hour. Git stores a full copy of
            # a rewritten file, so committing the growing day file every 2 minutes would add
            # ~1 GB a month per active salesman.
            archive_due=""
            if [ -n "$commit_pass" ]; then
              last=""
              if [ -f archive/state/offset.json ]; then
                last=$(jq -r '.lastArchive // empty' archive/state/offset.json 2>/dev/null || true)
              fi
              last_s=0
              if [ -n "$last" ]; then last_s=$(date -d "$last" +%s 2>/dev/null || echo 0); fi
              if [ $(( $(date +%s) - last_s )) -ge 3300 ]; then archive_due=1; fi
            fi

            BUILD_REPORTS="$archive_due" node scripts/poll_telegram.mjs || echo "poll failed, continuing"

            if [ -n "$commit_pass" ]; then
              git add dashboard/public/live.enc.json
              # customer cards are rare and small: commit them as soon as they land
              if [ -d archive/customers ]; then git add archive/customers; fi
              if [ -f dashboard/public/customers.enc.json ]; then git add dashboard/public/customers.enc.json; fi
              if [ -n "$archive_due" ]; then
                git add archive/daily archive/unmapped.enc.json archive/state dashboard/public/reports.enc.json
              fi
              if ! git diff --cached --quiet; then
                git commit -q -m "pings $(date -u +%FT%TZ)"
                if ! git push -q origin HEAD:main; then
                  # someone pushed while we were polling: merge, letting remote files in
                  # (a reset would silently delete files added during the run) and keeping
                  # our regenerated archive/live payload.
                  git fetch -q origin main
                  git merge -q --no-edit -X ours FETCH_HEAD || git merge --abort || true
                  git push -q origin HEAD:main || echo "push still blocked, next pass will retry"
                fi
              fi
            fi

            sleep 15
          done

      - name: Chain the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/chain.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/poll.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "chain dispatch -> HTTP $code"
          cat /tmp/chain.json
