name: poll-telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-poll
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name  "smgps-bot"
          git config user.email "smgps-bot@users.noreply.github.com"

      - name: Poll loop (4.5 min, every 15 s)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
        run: |
          set -u
          for i in $(seq 1 18); do
            node scripts/poll_telegram.mjs || echo "poll failed, continuing"

            # commit every 8th pass (~2 min) + the last one: the dashboard reads through a
            # CDN anyway, and every commit triggers a Pages/Render rebuild we don't need.
            if [ $((i % 8)) -eq 0 ] || [ "$i" -eq 18 ]; then
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q -m "pings $(date -u +%FT%TZ)"
                if ! git push -q origin HEAD:main; then
                  # someone else pushed while we were polling: keep our files, land on top
                  git fetch -q origin main
                  git reset -q --soft FETCH_HEAD
                  git add -A
                  git commit -q -m "pings $(date -u +%FT%TZ) (merge)"
                  git push -q origin HEAD:main || echo "push still blocked, next pass will retry"
                fi
              fi
            fi

            sleep 15
          done

      - name: Chain the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/chain.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/poll.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "chain dispatch -> HTTP $code"
          cat /tmp/chain.json
