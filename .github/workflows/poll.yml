name: poll-telegram

# Cron-only cadence: the run used to dispatch itself again at the end of every pass
# ("chain the next run"). That burned free-tier Actions minutes and — worse — each chain
# produced a fresh commit whose author was the GitHub Actions bot, bloating git history.
# The 5-minute cron below is now the single scheduler; nothing self-dispatches.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-poll
  # never cancel a pass mid-flight — it would lose the uncommitted archive and offset;
  # queue instead (the cron keeps the cadence)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4 # pin to a full SHA in production (e.g. @v4.1.7 -> <sha>)
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name  "smgps-bot"
          git config user.email "smgps-bot@users.noreply.github.com"

      - name: Poll loop (~4 min, every 15 s; commits on the first, middle and last pass)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
        run: |
          set -u
          for i in $(seq 1 16); do
            commit_pass=""
            if [ $((i % 9)) -eq 0 ] || [ "$i" -eq 16 ]; then commit_pass=1; fi

            # Free-tier economy: the live payload (small) commits every pass, while the
            # archive + offset + report land at most once an hour. Git stores a full copy of
            # a rewritten file, so committing the growing day file every 2 minutes would add
            # ~1 GB a month per active salesman.
            archive_due=""
            if [ -n "$commit_pass" ]; then
              last=""
              if [ -f archive/state/offset.json ]; then
                last=$(jq -r '.lastArchive // empty' archive/state/offset.json 2>/dev/null || true)
              fi
              last_s=0
              if [ -n "$last" ]; then last_s=$(date -d "$last" +%s 2>/dev/null || echo 0); fi
              if [ $(( $(date +%s) - last_s )) -ge 3300 ]; then archive_due=1; fi
            fi

            BUILD_REPORTS="$archive_due" node scripts/poll_telegram.mjs || echo "poll failed, continuing"

            if [ -n "$commit_pass" ]; then
              git add dashboard/public/live.enc.json
              # customer cards are rare and small: commit them as soon as they land
              if [ -d archive/customers ]; then git add archive/customers; fi
              if [ -f dashboard/public/customers.enc.json ]; then git add dashboard/public/customers.enc.json; fi
              # bot reply bookkeeping (one welcome per person per hour), tiny
              if [ -f archive/state/replies.json ]; then git add archive/state/replies.json; fi
              if [ -n "$archive_due" ]; then
                git add archive/daily archive/unmapped.enc.json archive/state dashboard/public/reports.enc.json
              fi
              # self-service /join: roster + pending queue only change when someone links,
              # and both files are encrypted — safe to commit, tiny, rare
              if [ -f private/roster.enc.json ]; then git add private/roster.enc.json; fi
              if [ -f private/pending.enc.json ]; then git add private/pending.enc.json; fi
              if ! git diff --cached --quiet; then
                git commit -q -m "pings $(date -u +%FT%TZ)"
                if ! git push -q origin HEAD:main; then
                  # someone pushed while we were polling: merge, letting remote files in
                  # (a reset would silently delete files added during the run) and keeping
                  # our regenerated archive/live payload.
                  git fetch -q origin main
                  # The roster is the one file where BOTH sides carry data we must keep
                  # (each pass auto-links different salesmen via /join). Union it before
                  # the blanket merge so -X ours can never drop a link. Do not write into
                  # the working tree here: that would make `git merge` refuse to run.
                  REMOTE_ROSTER=""
                  if git show FETCH_HEAD:private/roster.enc.json >/dev/null 2>&1; then
                    REMOTE_ROSTER=$(mktemp)
                    git show FETCH_HEAD:private/roster.enc.json > "$REMOTE_ROSTER"
                  fi
                  # -X ours silently discards remote changes on ANY conflicting file.
                  # Restrict the rerere-style safety net to our own regenerated paths:
                  # if the conflict touches anything else, fail loudly so a human looks.
                  if ! git merge -q --no-edit -X ours FETCH_HEAD; then
                    git merge --abort || true
                    [ -n "$REMOTE_ROSTER" ] && rm -f "$REMOTE_ROSTER"
                    echo "merge conflict outside our paths — NOT pushing, manual check needed"
                    exit 1
                  fi
                  if [ -n "$REMOTE_ROSTER" ]; then
                    node scripts/merge_rosters.mjs \
                      private/roster.enc.json "$REMOTE_ROSTER" private/roster.enc.json \
                      || echo "roster merge skipped"
                    rm -f "$REMOTE_ROSTER"
                    if ! git diff --quiet -- private/roster.enc.json; then
                      git add private/roster.enc.json
                      git commit -q -m "roster union $(date -u +%FT%TZ)"
                    fi
                  fi
                  git push -q origin HEAD:main || echo "push still blocked, next pass will retry"
                fi
              fi
            fi

            sleep 15
          done
