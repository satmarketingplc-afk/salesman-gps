name: keepalive

# Render's free web service sleeps after ~15 minutes without traffic, and a sleeping
# service cannot wake itself. This workflow pings /healthz so the Refresh button stays
# fast. GitHub's scheduler is best-effort (it can skip runs), so pair it with a free
# external monitor — cron-job.org or UptimeRobot, every 5 minutes:
#   https://salesman-gps.onrender.com/healthz
#
# The ping is harmless if the service is already awake.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the service
        env:
          URL: https://salesman-gps.onrender.com/healthz
        run: |
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 "$URL" || true)
            echo "attempt $i -> ${code:-no-answer}"
            if [ "$code" = "200" ]; then
              echo "awake"
              exit 0
            fi
            sleep 15
          done
          echo "service did not answer — check the Render dashboard"
          exit 1
