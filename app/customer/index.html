<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b3b2e" />
<title>New customer — Salesman GPS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --green:#0b3b2e; --green2:#0f5741; --mint:#34d399; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --bg:#f4f7f5; --card:#fff; --amber:#d97706; --red:#dc2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; min-height:100%}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Ethiopic',sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:96px; font-size:15px;
  }
  header{
    background:linear-gradient(160deg,var(--green),var(--green2)); color:#fff;
    padding:18px 18px 20px; position:sticky; top:0; z-index:5;
  }
  .top{display:flex; align-items:center; gap:10px}
  .top b{font-size:18px; letter-spacing:.2px}
  .top small{display:block; font-size:11.5px; color:#a7f3d0; margin-top:2px}
  .lang{
    margin-left:auto; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    color:#fff; border-radius:10px; padding:8px 11px; font-size:13px; cursor:pointer;
  }
  #mode{margin:10px 0 0; font-size:12px; color:#a7f3d0; line-height:1.45}
  main{padding:14px 16px 0; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px}
  .field{display:block; margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field > span{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; letter-spacing:.02em}
  input[type=text], input[type=tel], input[type=number], textarea{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 13px;
    font-size:16px; background:#fff; color:var(--ink); font-family:inherit;
  }
  textarea{resize:none; min-height:64px}
  input:focus, textarea:focus{outline:2px solid #bbf7d0; border-color:var(--mint)}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    border:1px solid var(--line); background:#f8fafc; color:var(--ink); border-radius:999px;
    padding:9px 12px; font-size:13.5px; cursor:pointer; font-family:inherit; line-height:1.1;
  }
  .chip.on{background:#e8f5ef; border-color:var(--mint); color:var(--green); font-weight:600}
  .geo{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); line-height:1.35}
  .geo .dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none}
  .geo.ok .dot{background:#10b981}
  .geo.warn .dot{background:var(--amber)}
  .geo.bad .dot{background:var(--red)}
  .geo button{
    margin-left:auto; border:1px solid var(--line); background:#fff; color:var(--green);
    border-radius:10px; padding:8px 10px; font-size:12.5px; cursor:pointer; font-family:inherit; flex:none;
  }
  .savebar{
    position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(244,247,245,0),var(--bg) 28%); z-index:6;
  }
  .savebar .wrap{max-width:560px; margin:0 auto}
  #save{
    width:100%; border:0; border-radius:14px; background:var(--green); color:#fff;
    font-size:16px; font-weight:700; padding:15px; cursor:pointer; font-family:inherit;
  }
  #save:active{background:var(--green2)}
  #save:disabled{opacity:.6}
  .recent{margin:2px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
  .recent li{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted)}
  .recent b{color:var(--ink); font-size:13px; font-weight:600}
  .pill{font-size:11px; padding:2px 8px; border-radius:999px; background:#eef4f1; color:var(--green); white-space:nowrap}
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translate(-50%,16px); opacity:0; pointer-events:none;
    background:#0f172a; color:#fff; font-size:13px; padding:11px 15px; border-radius:12px; max-width:88%;
    text-align:center; transition:.2s; z-index:9;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .hint{font-size:12px; color:var(--muted); line-height:1.5; margin:0}
  .err{color:var(--red); font-size:12.5px; margin:6px 0 0; display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <b id="title">New customer</b>
      <small id="sub">Saved to the company archive</small>
    </div>
    <button class="lang" id="lang">አማርኛ</button>
  </div>
  <p id="mode"></p>
</header>

<main>
  <section class="card">
    <label class="field">
      <span id="lName">Customer name *</span>
      <input id="name" type="text" autocomplete="off" maxlength="80" />
    </label>
    <div class="row">
      <label class="field">
        <span id="lPhone">Phone</span>
        <input id="phone" type="tel" inputmode="tel" autocomplete="off" maxlength="32" />
      </label>
      <label class="field">
        <span id="lBiz">Shop / business</span>
        <input id="biz" type="text" autocomplete="off" maxlength="60" />
      </label>
    </div>
    <p class="err" id="err"></p>
  </section>

  <section class="card">
    <div class="field">
      <span id="lProduct">Interested in</span>
      <div class="chips" id="products"></div>
    </div>
    <div class="row">
      <label class="field">
        <span id="lQty">Quantity</span>
        <input id="qty" type="number" inputmode="numeric" min="1" max="999" step="1" />
      </label>
      <div class="field">
        <span id="lStage">Status</span>
        <div class="chips" id="stages"></div>
      </div>
    </div>
    <label class="field">
      <span id="lNote">Note</span>
      <textarea id="note" maxlength="300" placeholder=""></textarea>
    </label>
  </section>

  <section class="card">
    <div class="geo" id="geo">
      <span class="dot"></span>
      <span id="geoText">Finding your location…</span>
      <button id="geoBtn" type="button">↻</button>
    </div>
  </section>

  <section class="card" id="recentCard" style="display:none">
    <div class="field">
      <span id="lRecent">Saved from this phone</span>
      <ul class="recent" id="recent"></ul>
    </div>
  </section>
</main>

<div class="savebar"><div class="wrap"><button id="save">Save customer</button></div></div>
<div class="toast" id="toast"></div>

<script>
const T = {
  en: {
    title:"New customer", sub:"Saved to the company archive",
    name:"Customer name *", phone:"Phone", biz:"Shop / business", product:"Interested in",
    qty:"Quantity", stage:"Status", note:"Note", notePh:"What did they ask for?",
    save:"Save customer", saved:"Saved to Telegram — back to the app",
    needName:"Please type the customer name",
    locating:"Finding your location…", located:"Location ready", weak:"Location found (weak signal)",
    denied:"No location — you can still save", retry:"↻",
    modeApp:"Fill the card, tap Save — it goes to the office archive.",
    modeWeb:"Opened in a browser: Save copies the card and opens the bot. Paste and send.",
    copied:"Card copied — paste it in Telegram and send",
    recent:"Saved from this phone", empty:"Nothing yet",
    stages:{ lead:"New lead", quote:"Quoted", won:"Won", lost:"Lost" },
    products:{ home:"Solar home", pump:"Solar pump", heater:"Water heater", inverter:"Inverter + battery", street:"Street light", other:"Other" }
  },
  am: {
    title:"አዲስ ደንበኛ", sub:"በኩባንያው መዝገብ ውስጥ ይቀመጣል",
    name:"የደንበኛ ስም *", phone:"ስልክ", biz:"ሱቅ / ድርጅት", product:"የሚፈልገው ምርት",
    qty:"ብዛት", stage:"ደረጃ", note:"ማስታወሻ", notePh:"ምን ጠየቁ?",
    save:"ደንበኛውን አስቀምጥ", saved:"ተቀምጧል — ወደ ቴሌግራም ተመልስ",
    needName:"እባክዎ የደንበኛውን ስም ይጻፉ",
    locating:"አካባቢዎን በመፈለግ ላይ…", located:"አካባቢ ዝግጁ ነው", weak:"አካባቢ ተገኝቷል (ደካማ ምልክት)",
    denied:"አካባቢ አልተገኘም — አሁንም ማስቀመጥ ይችላሉ", retry:"↻",
    modeApp:"ካርዱን ሞልተው አስቀምጥ ይጫኑ — ወደ ቢሮው መዝገብ ይሄዳል።",
    modeWeb:"በአሳሽ ተከፍቷል፡ አስቀምጥ ካርዱን ገልብጦ ቦቱን ይከፍታል። ፈጥረው ይላኩ።",
    copied:"ካርዱ ተገልብጧል — በቴሌግራም ውስጥ ፈጥረው ይላኩ",
    recent:"ከዚህ ስልክ የተቀመጡ", empty:"እስካሁን ምንም",
    stages:{ lead:"አዲስ", quote:"ዋጋ ተሰጥቷል", won:"ተሸጠ", lost:"አልተሸጠም" },
    products:{ home:"የቤት ሶላር", pump:"የፀሐይ ፓምፕ", heater:"የውሃ ማሞቂያ", inverter:"ኢንቮርተር + ባትሪ", street:"የመንገድ መብራት", other:"ሌላ" }
  }
};

const CONFIG = {
  bot: "salesmaplocationbot",
  products: ["home", "pump", "heater", "inverter", "street", "other"],
  stages: ["lead", "quote", "won", "lost"]
};

let lang = localStorage.getItem("smgps_lang") || "en";
const t = (k) => T[lang][k] ?? T.en[k];
const $ = (id) => document.getElementById(id);
const tg = window.Telegram?.WebApp;
const inTelegram = !!(tg && tg.initData);

let picked = { product: null, stage: "lead" };
let coords = null;

function applyLang() {
  document.documentElement.lang = lang === "am" ? "am" : "en";
  $("title").textContent = t("title");
  $("sub").textContent = t("sub");
  $("lName").textContent = t("name");
  $("lPhone").textContent = t("phone");
  $("lBiz").textContent = t("biz");
  $("lProduct").textContent = t("product");
  $("lQty").textContent = t("qty");
  $("lStage").textContent = t("stage");
  $("lNote").textContent = t("note");
  $("note").placeholder = t("notePh");
  $("save").textContent = t("save");
  $("lRecent").textContent = t("recent");
  $("lang").textContent = lang === "am" ? "English" : "አማርኛ";
  $("mode").textContent = inTelegram ? t("modeApp") : t("modeWeb");
  localStorage.setItem("smgps_lang", lang);
  paintChips();
  paintGeo();
  paintRecent();
}

function paintChips() {
  $("products").innerHTML = CONFIG.products
    .map((p) => `<button type="button" class="chip${picked.product === p ? " on" : ""}" data-p="${p}">${t("products")[p]}</button>`)
    .join("");
  $("stages").innerHTML = CONFIG.stages
    .map((s) => `<button type="button" class="chip${picked.stage === s ? " on" : ""}" data-s="${s}">${t("stages")[s]}</button>`)
    .join("");
}

function paintGeo() {
  const el = $("geo");
  el.className = "geo " + (coords ? (coords.acc && coords.acc > 120 ? "warn" : "ok") : "bad");
  $("geoText").textContent = coords
    ? `${coords.acc && coords.acc > 120 ? t("weak") : t("located")} · ±${Math.round(coords.acc || 0)} m`
    : t("denied");
  $("geoBtn").textContent = t("retry");
}

function paintRecent() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem("smgps_cards") || "[]"); } catch { list = []; }
  $("recentCard").style.display = list.length ? "" : "none";
  $("recent").innerHTML = list
    .slice(0, 4)
    .map((c) => `<li><b>${escapeHtml(c.name)}</b><span class="pill">${t("stages")[c.stage] || c.stage}</span><span>${new Date(c.savedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}</span></li>`)
    .join("");
}

const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2600);
}

function locate() {
  if (!navigator.geolocation) { coords = null; paintGeo(); return; }
  $("geoText").textContent = t("locating");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      coords = { lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), acc: pos.coords.accuracy || 0 };
      paintGeo();
    },
    () => { coords = null; paintGeo(); },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}

function buildPayload() {
  const qty = Number($("qty").value);
  return {
    v: 1,
    id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7),
    name: $("name").value.trim(),
    phone: $("phone").value.trim(),
    biz: $("biz").value.trim(),
    product: picked.product ? (t("products")[picked.product] || picked.product) : "",
    productKey: picked.product || "",
    qty: Number.isFinite(qty) && qty > 0 ? qty : null,
    stage: picked.stage || "lead",
    lat: coords?.lat ?? null,
    lng: coords?.lng ?? null,
    note: $("note").value.trim(),
  };
}

const buildText = (payload) => "#CUST " + JSON.stringify(payload);

function remember(payload) {
  let list = [];
  try { list = JSON.parse(localStorage.getItem("smgps_cards") || "[]"); } catch { list = []; }
  list.unshift({ ...payload, savedAt: new Date().toISOString() });
  localStorage.setItem("smgps_cards", JSON.stringify(list.slice(0, 20)));
}

async function save() {
  $("err").style.display = "none";
  const payload = buildPayload();
  if (!payload.name) {
    $("err").textContent = t("needName");
    $("err").style.display = "block";
    $("name").focus();
    return;
  }

  remember(payload);

  if (inTelegram) {
    try {
      tg.sendData(JSON.stringify(payload));
      tg.close();
      return;
    } catch {
      /* older client — fall through to the manual path */
    }
  }

  const text = buildText(payload);
  if (navigator.share) {
    try {
      await navigator.share({ text });
      toast(t("saved"));
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }
  try { await navigator.clipboard.writeText(text); } catch { /* clipboard blocked */ }
  window.open(`https://t.me/${CONFIG.bot}`, "_blank");
  toast(t("copied"));
}

// wiring
$("lang").addEventListener("click", () => { lang = lang === "am" ? "en" : "am"; applyLang(); });
$("save").addEventListener("click", save);
$("geoBtn").addEventListener("click", (e) => { e.stopPropagation(); locate(); });
$("products").addEventListener("click", (e) => {
  const b = e.target.closest("[data-p]");
  if (!b) return;
  picked.product = picked.product === b.dataset.p ? null : b.dataset.p;
  paintChips();
});
$("stages").addEventListener("click", (e) => {
  const b = e.target.closest("[data-s]");
  if (!b) return;
  picked.stage = b.dataset.s;
  paintChips();
});

if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#0b3b2e"); } catch {}
}

// test hooks (harmless in production)
window.SMGPSCustomer = { buildPayload, buildText, save, locate, state: () => ({ coords, picked, inTelegram }) };

applyLang();
locate();
</script>
</body>
</html>
