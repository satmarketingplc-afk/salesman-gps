<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reports — Salesman GPS</title>
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc;
    --ok:#059669; --warn:#d97706; --off:#94a3b8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic",sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:10px; padding:12px 18px;
    background:var(--ink); color:#fff; flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; margin-right:auto; line-height:1.15}
  .brand b{font-size:16px; letter-spacing:.2px}
  .brand span{font-size:12px; color:#cbd5e1}
  .hbtn{
    background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.18);
    border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer; text-decoration:none;
    min-height:38px; display:inline-flex; align-items:center;
  }
  .hbtn:hover{background:rgba(255,255,255,.18)}
  .hbtn:disabled{opacity:.5; cursor:default}

  main{padding:18px; display:flex; flex-direction:column; gap:16px; max-width:1200px; width:100%; margin:0 auto}
  .cards{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px}
  .card b{display:block; font-size:22px; line-height:1.2}
  .card span{font-size:12px; color:var(--muted)}

  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .toolbar input{
    flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line);
    border-radius:10px; font-size:14px; background:#fff;
  }
  #status{font-size:12px; color:var(--muted)}

  .day{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden}
  .day h2{
    margin:0; padding:12px 14px; font-size:14px; background:#f1f5f9;
    display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; color:var(--ink);
  }
  .day h2 small{font-weight:500; color:var(--muted)}
  .tw{overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:560px}
  th,td{padding:9px 12px; text-align:left; border-top:1px solid var(--line); white-space:nowrap}
  th{font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:600}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#f8fafc}
  .pname{display:flex; align-items:center; gap:8px; font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .km{font-weight:700; color:#3730a3}
  .empty{color:var(--muted); font-size:13px; padding:18px}

  footer{
    margin-top:auto; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:10px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--muted);
  }

  .gate{
    position:fixed; inset:0; background:rgba(15,23,42,.72); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:9999;
  }
  .gate.hidden{display:none}
  .gate form{background:#fff; border-radius:16px; padding:22px; width:100%; max-width:360px}
  .gate h2{margin:0 0 4px; font-size:18px}
  .gate p{margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.5}
  .gate input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; margin-bottom:10px;
  }
  .gate .err{color:#dc2626; font-size:13px; margin-bottom:10px; background:#fef2f2; padding:8px 10px; border-radius:8px}
  .gate button{
    width:100%; padding:11px; border:0; border-radius:10px; background:var(--ink);
    color:#fff; font-size:15px; cursor:pointer;
  }

  @media (max-width:820px){
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    header{padding:10px 12px}
    main{padding:12px}
    .brand span{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <b>Salesman GPS</b>
    <span data-i18n="subtitle">Daily activity</span>
  </div>
  <a class="hbtn" href="../dashboard/">← <span data-i18n="map">Map</span></a>
  <button class="hbtn" id="lang">አማርኛ</button>
  <button class="hbtn" id="csv" data-i18n="csv">CSV</button>
  <button class="hbtn" id="refresh" data-i18n="refresh">Refresh</button>
</header>

<main>
  <section class="cards" id="cards"></section>
  <div class="toolbar">
    <input id="q" data-i18n-ph="search" placeholder="Search name or code" />
    <span id="status"></span>
  </div>
  <div id="days"></div>
</main>

<footer>
  <span id="generated">—</span>
  <span data-i18n="note">Times are EAT. Distance ignores GPS jumps over 500 m.</span>
</footer>

<div class="gate" id="gate">
  <form id="gateForm">
    <h2 data-i18n="passTitle">Passphrase</h2>
    <p data-i18n="passHint">The reports are encrypted. Enter the dashboard passphrase.</p>
    <div class="err" id="gateErr" style="display:none"></div>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" />
    <button type="submit" data-i18n="open">Open reports</button>
  </form>
</div>

<script>
const I18N = {
  en: {
    subtitle:"Daily activity", map:"Map", csv:"CSV", refresh:"Refresh",
    search:"Search name or code", passTitle:"Passphrase",
    passHint:"The reports are encrypted. Enter the dashboard passphrase.",
    open:"Open reports", wrongPass:"Wrong passphrase.", noData:"No activity recorded yet.",
    people:"people", distance:"distance", pings:"points", days:"days recorded",
    name:"Salesman", first:"First seen", last:"Last seen", livePts:"live",
    generated:"updated", note:"Times are EAT. Distance ignores GPS jumps over 500 m.",
    total:"total", km:"km"
  },
  am: {
    subtitle:"የቀን እንቅስቃሴ", map:"ካርታ", csv:"CSV", refresh:"አድስ",
    search:"ስም ወይም ኮድ ይፈልጉ", passTitle:"የመግቢያ ቃል",
    passHint:"ሪፖርቶቹ ተመስጥረዋል። የካርታውን የመግቢያ ቃል ያስገቡ።",
    open:"ሪፖርቱን ክፈት", wrongPass:"የመግቢያ ቃሉ ስህተት ነው።", noData:"እስካሁን እንቅስቃሴ የለም።",
    people:"ሰዎች", distance:"ርቀት", pings:"ነጥቦች", days:"የተመዘገቡ ቀናት",
    name:"ሽያጭ ሠራተኛ", first:"የመጀመሪያ", last:"መጨረሻ", livePts:"ቀጥታ",
    generated:"የተዘመነ", note:"ሰዓቶች በምስራቅ አፍሪካ ሰዓት ናቸው። ከ500 ሜ በላይ የጂፒኤስ መዝለል አይቆጠርም።",
    total:"ድምር", km:"ኪ.ሜ"
  }
};
let lang = localStorage.getItem("smgps_lang") || "en";
const t = (k) => (I18N[lang][k] ?? I18N.en[k] ?? k);
const $ = (id) => document.getElementById(id);

let data = null;
let query = "";

function b64(buf) {
  return Uint8Array.from(atob(buf), (c) => c.charCodeAt(0));
}

async function decrypt(payload, passphrase) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(payload.salt), iterations: payload.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const ct = b64(payload.ct);
  const tag = b64(payload.tag);
  const both = new Uint8Array(ct.length + tag.length);
  both.set(ct); both.set(tag, ct.length);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(payload.iv), tagLength: 128 }, key, both);
  return JSON.parse(new TextDecoder().decode(plain));
}

// Online-only: always read from the hosted repo (GitHub raw). No local/file fallbacks.
// Owner/repo derived from the page URL so forks/renames need no code edit.
(function () {
  const host = location.hostname;
  let owner = "satmarketingplc-afk", repo = "salesman-gps";
  const ghPages = host.match(/^(?:www\.)?([^./]+)\.github\.(io|dev)$/);
  if (ghPages) {
    owner = ghPages[1];
    const seg = location.pathname.split("/").filter(Boolean);
    if (seg.length && !["dashboard", "customers", "reports", "app"].includes(seg[0])) repo = seg[0];
  }
  const q = new URLSearchParams(location.search);
  window.GH_OWNER = q.get("owner") || owner;
  window.GH_REPO_NAME = q.get("repo") || repo;
})();
const DATA_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO_NAME}/main/dashboard/public/reports.enc.json`;

const hhmm = (iso) =>
  new Date(iso).toLocaleTimeString("en-GB", { timeZone: "Africa/Addis_Ababa", hour: "2-digit", minute: "2-digit" });

const dayLabel = (day) =>
  new Date(`${day}T12:00:00Z`).toLocaleDateString(lang === "am" ? "am-ET" : "en-GB", {
    weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC",
  });

async function load() {
  const pass = sessionStorage.getItem("smgps_pass");
  if (!pass) { $("gate").classList.remove("hidden"); return; }
  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`http ${res.status}`);
    data = await decrypt(await res.json(), pass);
    $("gate").classList.add("hidden");
    $("generated").textContent = `${t("generated")} ${new Date(data.generated).toLocaleTimeString("en-GB", { timeZone: "Africa/Addis_Ababa" })} EAT`;
    render();
  } catch (err) {
    if (String(err.message).includes("http 404")) {
      data = { generated: new Date().toISOString(), days: [] };
      $("gate").classList.add("hidden");
      render();
      return;
    }
    sessionStorage.removeItem("smgps_pass");
    $("gateErr").textContent = t("wrongPass");
    $("gateErr").style.display = "block";
    $("gate").classList.remove("hidden");
  }
}

function render() {
  const days = (data?.days || []).map((d) => ({
    ...d,
    rows: d.rows.filter((r) => {
      const q = query.trim().toLowerCase();
      if (!q) return true;
      return `${r.name} ${r.nameAm} ${r.code}`.toLowerCase().includes(q);
    }),
  }));

  const latest = data?.days?.[0];
  $("cards").innerHTML = latest
    ? `
      <div class="card"><b>${latest.totals.people}</b><span>${t("people")} · ${dayLabel(latest.day)}</span></div>
      <div class="card"><b>${latest.totals.km} ${t("km")}</b><span>${t("distance")}</span></div>
      <div class="card"><b>${latest.totals.pings}</b><span>${t("pings")}</span></div>
      <div class="card"><b>${data.days.length}</b><span>${t("days")}</span></div>`
    : `<div class="card"><b>—</b><span>${t("noData")}</span></div>`;

  const box = $("days");
  const visible = days.filter((d) => d.rows.length);
  if (!visible.length) {
    box.innerHTML = `<div class="empty">${t("noData")}</div>`;
    $("status").textContent = "";
    return;
  }

  box.innerHTML = visible
    .map(
      (d) => `
      <section class="day">
        <h2><span>${dayLabel(d.day)}</span>
          <small>${d.totals.people} ${t("people")} · ${d.totals.km} ${t("km")} · ${d.totals.pings} ${t("pings")}</small>
        </h2>
        <div class="tw"><table>
          <thead><tr>
            <th>${t("name")}</th><th>${t("first")}</th><th>${t("last")}</th>
            <th class="num">${t("pings")}</th><th class="num">${t("livePts")}</th><th class="num">${t("km")}</th>
          </tr></thead>
          <tbody>
            ${d.rows
              .map(
                (r) => `<tr>
                  <td><span class="pname"><span class="dot" style="background:${r.color}"></span>${
                    lang === "am" ? r.nameAm : r.name
                  } <span style="color:#94a3b8;font-weight:400">${r.code}</span></span></td>
                  <td>${hhmm(r.first)}</td>
                  <td>${hhmm(r.last)}</td>
                  <td class="num">${r.pings}</td>
                  <td class="num">${r.live}</td>
                  <td class="num km">${r.km.toFixed(1)}</td>
                </tr>`
              )
              .join("")}
          </tbody>
        </table></div>
      </section>`
    )
    .join("");

  const rows = days.reduce((n, d) => n + d.rows.length, 0);
  $("status").textContent = `${rows} / ${data.days.reduce((n, d) => n + d.rows.length, 0)}`;
}

function csv() {
  if (!data?.days?.length) return;
  const lines = ["date,code,name,first_seen,last_seen,pings,live_pings,km"];
  for (const d of data.days) {
    for (const r of d.rows) {
      lines.push(
        [d.day, r.code, `"${r.name.replace(/"/g, '""')}"`, r.first, r.last, r.pings, r.live, r.km.toFixed(1)].join(",")
      );
    }
  }
  const blob = new Blob([lines.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `salesman-gps-activity-${data.days[0].day}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function applyLang() {
  document.documentElement.lang = lang === "am" ? "am" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    if (I18N[lang][k]) el.textContent = I18N[lang][k];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
    const k = el.getAttribute("data-i18n-ph");
    if (I18N[lang][k]) el.placeholder = I18N[lang][k];
  });
  $("lang").textContent = lang === "am" ? "English" : "አማርኛ";
  localStorage.setItem("smgps_lang", lang);
  if (data) render();
}

$("lang").onclick = () => { lang = lang === "en" ? "am" : "en"; applyLang(); };
$("refresh").onclick = () => load();
$("csv").onclick = () => csv();
$("q").oninput = (e) => { query = e.target.value; render(); };

$("gateForm").onsubmit = async (e) => {
  e.preventDefault();
  const pass = $("pass").value;
  if (!pass) return;
  sessionStorage.setItem("smgps_pass", pass);
  $("gateErr").style.display = "none";
  await load();
};

applyLang();
load();
</script>
</body>
</html>
