<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Salesman GPS — ሽያጭ ሠራተኞች ካርታ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f6f8fb; --card:#ffffff;
    --ok:#059669; --warn:#d97706; --off:#94a3b8; --brand:#0f172a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Nyala','Abyssinica SIL',sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
  }
  header{
    background:var(--brand); color:#fff; display:flex; align-items:center; gap:14px;
    padding:12px 18px; flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; line-height:1.15; margin-right:auto}
  .brand b{font-size:17px; letter-spacing:.2px}
  .brand span{font-size:12px; color:#94a3b8}
  .hbtn{
    background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18);
    border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer;
  }
  .hbtn:hover{background:rgba(255,255,255,.16)}
  .status{font-size:12px; color:#cbd5e1}
  main{flex:1; display:flex; min-height:0}
  aside{
    width:330px; background:var(--card); border-right:1px solid var(--line);
    overflow:auto; padding:14px; display:flex; flex-direction:column; gap:10px;
  }
  #map{flex:1; min-width:0; background:#e9eef3}
  .person{
    border:1px solid var(--line); border-radius:12px; padding:11px 12px; cursor:pointer;
    background:#fff; transition:box-shadow .15s,border-color .15s;
  }
  .person:hover{box-shadow:0 4px 14px rgba(15,23,42,.08); border-color:#cbd5e1}
  .person.active{border-color:var(--ink); box-shadow:0 4px 16px rgba(15,23,42,.12)}
  .prow{display:flex; align-items:center; gap:9px}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .pname{font-weight:600; font-size:14px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip{font-size:11px; padding:2px 7px; border-radius:999px; background:#f1f5f9; color:var(--muted)}
  .chip.on{background:#ecfdf5; color:var(--ok)}
  .chip.stale{background:#fffbeb; color:var(--warn)}
  .chip.off{background:#f1f5f9; color:var(--off)}
  .chip.recent{background:#eff6ff; color:#1d4ed8}
  .pmeta{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:7px}
  .pmeta b{color:var(--ink); font-weight:600}
  .dist{display:inline-flex; align-items:center; gap:5px; background:#eef2ff; color:#3730a3;
    font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap}
  .dist svg{width:12px; height:12px; flex:none}
  .leaflet-tooltip.pinlabel{background:rgba(15,23,42,.88); color:#fff; border:0; border-radius:6px;
    font-size:11px; font-weight:600; padding:3px 7px; box-shadow:0 2px 8px rgba(15,23,42,.25)}
  .leaflet-tooltip.pinlabel::before{display:none}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:#fff; font-size:13px; line-height:1.4; padding:9px 14px;
    border-radius:10px; max-width:min(90vw,420px); text-align:center; z-index:6000;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (max-width:820px){ .toast{bottom:16px; font-size:12px} }
  .empty{color:var(--muted); font-size:13px; line-height:1.5; padding:16px 4px}
  .gate{
    position:fixed; inset:0; background:rgba(15,23,42,.72); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:9999;
  }
  .gate.hidden{display:none}
  .gate form{background:#fff; border-radius:16px; padding:22px; width:100%; max-width:360px}
  .gate h2{margin:0 0 4px; font-size:18px}
  .gate p{margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.5}
  .gate input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; margin-bottom:10px;
  }
  .gate button{
    width:100%; padding:11px; border:0; border-radius:10px; background:var(--ink);
    color:#fff; font-size:15px; cursor:pointer;
  }
  .gate .err{color:#dc2626; font-size:12px; margin:0 0 10px}
  footer{
    background:#fff; border-top:1px solid var(--line); padding:6px 18px; font-size:11px;
    color:var(--muted); display:flex; gap:16px; flex-wrap:wrap;
  }
  @media (max-width:820px){
    header{gap:8px; padding:10px 14px}
    .status, #refresh{display:none}
    .brand b{font-size:16px}
    main{flex-direction:column-reverse}
    aside{width:100%; max-height:44vh; border-right:0; border-top:1px solid var(--line)}
    #map{min-height:52vh}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <b data-i18n="title">Salesman GPS</b>
    <span data-i18n="subtitle">Live field positions</span>
  </div>
  <div class="status" id="status">—</div>
  <button class="hbtn" id="lang">አማርኛ</button>
  <a class="hbtn" id="reportsBtn" href="../reports/" data-i18n="reportsBtn">Reports</a>
  <button class="hbtn" id="refresh" data-i18n="refresh">Refresh</button>
  <button class="hbtn" id="lock">🔒</button>
</header>

<main>
  <aside id="list"></aside>
  <div id="map"></div>
</main>

<footer>
  <span id="generated">—</span>
  <span data-i18n="footer">Accuracy circles are real GPS error, not decoration.</span>
</footer>

<div class="gate" id="gate">
  <form id="gateForm">
    <h2 data-i18n="passTitle">Passphrase</h2>
    <p data-i18n="passHint">The positions are encrypted. Enter the dashboard passphrase to open the map.</p>
    <div class="err" id="gateErr" style="display:none"></div>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" />
    <button type="submit" data-i18n="open">Open map</button>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const I18N = {
  en: {
    title:"Salesman GPS", subtitle:"Live field positions", refresh:"Refresh",
    salesmen:"Salesmen", lastSeen:"last seen", online:"live", stale:"stale", off:"offline", recent:"recent",
    reportsBtn:"Reports",
    justNow:"just now", min:"min ago", hour:"h ago", accuracy:"accuracy", battery:"battery", start:"start",
    today:"today", coveredToday:"covered today", passTitle:"Passphrase",
    nudgeSent:"Location request sent to {n}. New point appears in a few minutes.",
    nudgeBusy:"Please wait {n}s before asking again.",
    nudgeFail:"Could not reach the server — showing the latest saved position.",
    passHint:"The positions are encrypted. Enter the dashboard passphrase to open the map.",
    open:"Open map", wrongPass:"Wrong passphrase.", noData:"No positions yet. Send a live location to the bot.",
    footer:"Accuracy circles are real GPS error, not decoration.",
    generated:"updated", people:"people", m:"m", km:"km"
  },
  am: {
    title:"የሽያጭ ሠራተኞች ካርታ", subtitle:"ቀጥታ የመስክ አቀማመጥ", refresh:"አድስ",
    salesmen:"ሽያጭ ሠራተኞች", lastSeen:"መጨረሻ የታየው", online:"ቀጥታ", stale:"ዘግይቷል", off:"ከመስመር ውጭ", recent:"አዲስ",
    reportsBtn:"ሪፖርት",
    justNow:"አሁን", min:"ደቂቃ በፊት", hour:"ሰዓት በፊት", accuracy:"ትክክለኛነት", battery:"ባትሪ", start:"መነሻ",
    today:"ዛሬ", coveredToday:"ዛሬ የተጓዘው", passTitle:"የመግቢያ ቃል",
    nudgeSent:"የአካባቢ ጥያቄ ወደ {n} ተልኳል። አዲሱ ነጥብ በጥቂት ደቂቃዎች ይታያል።",
    nudgeBusy:"እባክዎ {n} ሰከንድ ይጠብቁ።",
    nudgeFail:"ሰርቨሩ አልተገኘም — የመጨረሻው አካባቢ ይታያል።",
    passHint:"አካባቢዎቹ ተመስጥረዋል። ካርታውን ለመክፈት የመግቢያ ቃሉን ያስገቡ።",
    open:"ካርታውን ክፈት", wrongPass:"የመግቢያ ቃሉ ስህተት ነው።", noData:"እስካሁን አካባቢ የለም። ለቦቱ ቀጥታ አካባቢ ይላኩ።",
    footer:"የትክክለኛነት ክበቦች እውነተኛ የጂፒኤስ ስህተት ናቸው።",
    generated:"የተዘመነ", people:"ሰዎች", m:"ሜ", km:"ኪ.ሜ"
  }
};
let lang = localStorage.getItem("smgps_lang") || "en";
const t = (k) => (I18N[lang][k] ?? I18N.en[k] ?? k);

const map = L.map("map", { zoomControl: true, attributionControl: true }).setView([9.0108, 38.7613], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

let layers = [];
let data = null;
let activeCode = null;
let timer = null;

const $ = (id) => document.getElementById(id);

function applyLang() {
  document.documentElement.lang = lang === "am" ? "am" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    if (I18N[lang][k]) el.textContent = I18N[lang][k];
  });
  $("lang").textContent = lang === "am" ? "English" : "አማርኛ";
  localStorage.setItem("smgps_lang", lang);
  if (data) draw(false);   // re-label pins in the new language, keep the current viewport
  render();
}

function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return t("justNow");
  if (s < 3600) return `${Math.floor(s / 60)} ${t("min")}`;
  return `${Math.floor(s / 3600)} ${t("hour")}`;
}

function distanceKm(trail) {
  if (!trail || trail.length < 2) return 0;
  const R = 6371, rad = (d) => (d * Math.PI) / 180;
  let sum = 0;
  for (let i = 1; i < trail.length; i++) {
    const [a1, o1] = trail[i - 1], [a2, o2] = trail[i];
    const dA = rad(a2 - a1), dO = rad(o2 - o1);
    const h = Math.sin(dA / 2) ** 2 + Math.cos(rad(a1)) * Math.cos(rad(a2)) * Math.sin(dO / 2) ** 2;
    sum += 2 * R * Math.asin(Math.sqrt(h));
  }
  return sum;
}

// full-day distance from the poller; falls back to the 4 h trail for older payloads
function coveredKm(p) {
  return typeof p.distKm === "number" ? p.distKm : distanceKm(p.trail);
}

function b64(buf) {
  return Uint8Array.from(atob(buf), (c) => c.charCodeAt(0));
}

async function decrypt(payload, passphrase) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(payload.salt), iterations: payload.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const ct = b64(payload.ct);
  const tag = b64(payload.tag);
  const both = new Uint8Array(ct.length + tag.length);
  both.set(ct); both.set(tag, ct.length);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(payload.iv), tagLength: 128 }, key, both);
  return JSON.parse(new TextDecoder().decode(plain));
}

// Online-only: always read the live payload from the hosted repo (GitHub raw).
// Works identically on GitHub Pages and Render — no local/file fallbacks.
// Owner/repo are derived automatically from the page URL, so forks and renames
// work with zero edits. Override with ?owner=X&repo=Y&tld=github.io if needed.
(function () {
  const host = location.hostname;
  let owner = "satmarketingplc-afk", repo = "salesman-gps";
  const ghPages = host.match(/^(?:www\.)?([^./]+)\.github\.io$/);
  const custom = host.match(/^(?:www\.)?([^./]+)\.github\.dev$/);
  if (ghPages || custom) {
    owner = ghPages ? ghPages[1] : custom[1];
    const seg = location.pathname.split("/").filter(Boolean);
    if (seg.length && seg[0] !== "dashboard" && seg[0] !== "customers" && seg[0] !== "reports") repo = seg[0];
  }
  const q = new URLSearchParams(location.search);
  window.GH_OWNER = q.get("owner") || owner;
  window.GH_REPO_NAME = q.get("repo") || repo;
})();
const LIVE_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO_NAME}/main/dashboard/public/live.enc.json`;

// The hosting server (Render) answers /healthz and can ask the team for a fresh point.
// On GitHub Pages these paths 404, so the button silently falls back to a plain reload.
let canNudge = false;
fetch("/healthz", { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => { canNudge = j && j.service === "salesman-gps"; })
  .catch(() => {});

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 4500);
}

async function load() {
  const pass = sessionStorage.getItem("smgps_pass");
  if (!pass) { $("gate").classList.remove("hidden"); return; }
  try {
    const res = await fetch(`${LIVE_URL}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`http ${res.status}`);
    const box = await res.json();
    data = await decrypt(box, pass);
    $("gate").classList.add("hidden");
    $("generated").textContent = `${t("generated")} ${new Date(data.generated).toLocaleTimeString("en-GB", { timeZone: "Africa/Addis_Ababa" })} EAT`;
    $("status").textContent = `${data.salesmen.length} ${t("people")}`;
    draw();
    render();
  } catch (err) {
    if (String(err.message).includes("http 404")) {
      $("status").textContent = t("noData");
      return;
    }
    sessionStorage.removeItem("smgps_pass");
    $("gateErr").textContent = t("wrongPass");
    $("gateErr").style.display = "block";
    $("gate").classList.remove("hidden");
  }
}

function draw(fit = true) {
  layers.forEach((l) => map.removeLayer(l));
  layers = [];
  if (!data) return;

  data.salesmen.forEach((p) => {
    const color = p.color || "#2563eb";
    if (p.trail && p.trail.length > 1) {
      layers.push(
        L.polyline(p.trail, {
          color, weight: p.online ? 4 : 3, opacity: p.online ? 0.7 : 0.35,
          dashArray: p.online ? null : "6 8", smoothFactor: 2
        }).addTo(map)
      );
      // where the day started, so the trace reads as a route, not a scribble
      const start = L.circleMarker(p.trail[0], {
        radius: 4, color: "#fff", weight: 2, fillColor: color, fillOpacity: 0.9
      }).addTo(map);
      start.bindTooltip(t("start"), { direction: "top", offset: [0, -7], className: "pinlabel" });
      layers.push(start);
    }
    if (p.acc) {
      layers.push(L.circle([p.lat, p.lng], {
        radius: p.acc, color, weight: 1, opacity: 0.35, fillColor: color, fillOpacity: 0.07
      }).addTo(map));
    }
    const dot = L.circleMarker([p.lat, p.lng], {
      radius: 9, color: "#fff", weight: 3, fillColor: color,
      fillOpacity: p.online ? 1 : 0.55
    }).addTo(map);
    const name = lang === "am" ? (p.nameAm || p.name) : p.name;
    const km = coveredKm(p).toFixed(1);

    dot.bindPopup(
      `<b>${name}</b><br>` +
      `${p.code}<br>${t("lastSeen")}: ${ago(p.ts)}<br>` +
      `${t("coveredToday")}: <b>${km} ${t("km")}</b><br>` +
      `${t("accuracy")}: ±${Math.round(p.acc || 0)} ${t("m")}` +
      (p.battery != null ? `<br>${t("battery")}: ${p.battery}%` : "")
    );
    // the same distance, visible on the map without opening the popup
    dot.bindTooltip(`${name} · ${km} ${t("km")}`, {
      permanent: true, direction: "right", offset: [11, 0], className: "pinlabel"
    });
    dot.on("click", () => setActive(p.code, false));
    layers.push(dot);
  });

  if (fit && layers.length) map.fitBounds(L.featureGroup(layers).getBounds().pad(0.25), { maxZoom: 15 });
}

function setActive(code, fly = true) {
  activeCode = code;
  const p = data && data.salesmen.find((s) => s.code === code);
  if (p && fly) map.flyTo([p.lat, p.lng], 16, { duration: 0.8 });
  render();
}

function render() {
  const list = $("list");
  if (!data) { list.innerHTML = `<div class="empty">${t("noData")}</div>`; return; }
  if (!data.salesmen.length) { list.innerHTML = `<div class="empty">${t("noData")}</div>`; return; }

  list.innerHTML = "";
  data.salesmen.forEach((p) => {
    const recent = Date.now() - Date.parse(p.ts);
    // live session > recent one-tap point > stale > offline
    const fresh = recent < 15 * 60 * 1000;
    const cls = p.live ? "on" : (fresh ? "recent" : "off");
    const label = p.live ? t("online") : (fresh ? t("recent") : t("off"));
    const km = coveredKm(p).toFixed(1);

    const card = document.createElement("div");
    card.className = "person" + (p.code === activeCode ? " active" : "");
    card.innerHTML = `
      <div class="prow">
        <span class="dot" style="background:${p.color}"></span>
        <span class="pname">${lang === "am" ? (p.nameAm || p.name) : p.name}</span>
        <span class="chip ${cls}">${label}</span>
      </div>
      <div class="pmeta">
        <span>${p.code} · ${t("lastSeen")} <b>${ago(p.ts)}</b></span>
        <span class="dist" title="${t("coveredToday")}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 18h3l3-9 3 6 2-3h5"/><circle cx="4" cy="18" r="1.6"/><circle cx="20" cy="12" r="1.6"/>
          </svg>${km} ${t("km")}</span>
      </div>`;
    card.onclick = () => setActive(p.code);
    list.appendChild(card);
  });
}

$("lang").onclick = () => { lang = lang === "en" ? "am" : "en"; applyLang(); };
$("lock").onclick = () => { sessionStorage.removeItem("smgps_pass"); location.reload(); };

// Refresh = "ask the team where they are now", then keep reloading for ~5 min so the
// new point shows up by itself. Without the server (GitHub Pages) it is a plain reload.
$("refresh").onclick = async () => {
  if (!canNudge) return load();

  const btn = $("refresh");
  btn.disabled = true;
  try {
    const res = await fetch("/api/nudge", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ pass: sessionStorage.getItem("smgps_pass") || "" }),
    });
    const out = await res.json().catch(() => ({}));
    if (out.ok) {
      toast(t("nudgeSent").replace("{n}", out.sent.length));
    } else if (out.error === "busy") {
      toast(t("nudgeBusy").replace("{n}", out.retryIn || 20));
    } else {
      toast(t("nudgeFail"));
    }
  } catch {
    toast(t("nudgeFail"));
  } finally {
    btn.disabled = false;
  }

  for (let i = 0; i < 15; i++) {
    await new Promise((r) => setTimeout(r, 20000));
    await load();
  }
};

$("gateForm").onsubmit = async (e) => {
  e.preventDefault();
  const pass = $("pass").value;
  if (!pass) return;
  sessionStorage.setItem("smgps_pass", pass);
  $("gateErr").style.display = "none";
  await load();
};

applyLang();
load();
timer = setInterval(load, 30000);
</script>
</body>
</html>
